<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sports Event Registration System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🏆 Sports Event Registration System</h1>
        <p>Register now and participate in your favorite sport!</p>
    </header>

    <div class="container">

        <!-- Registration Form -->
        <div class="form-box">

            <h2>Participant Registration</h2>

            <form id="registrationForm">

                <label for="name">Participant Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <label for="age">Age</label>
                <input
                    type="number"
                    id="age"
                    placeholder="Enter your age"
                    min="1"
                    required
                >

                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                <label for="sport">Select Sport</label>
                <select id="sport" required>
                    <option value="">Select Sport</option>
                    <option value="Cricket">Cricket</option>
                    <option value="Football">Football</option>
                    <option value="Basketball">Basketball</option>
                    <option value="Volleyball">Volleyball</option>
                    <option value="Badminton">Badminton</option>
                    <option value="Tennis">Tennis</option>
                    <option value="Athletics">Athletics</option>
                </select>

                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter 10-digit phone number"
                    maxlength="10"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter email address"
                    required
                >

                <button type="submit">Register Now</button>

                <button
                    type="reset"
                    class="reset-btn"
                >
                    Clear
                </button>

            </form>

        </div>


        <!-- Participants Table -->
        <div class="table-box">

            <h2>Registered Participants</h2>

            <input
                type="text"
                id="search"
                placeholder="Search participant..."
            >

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Sport</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="participantTable">
                    </tbody>

                </table>

            </div>

            <p id="noData">
                No participants registered yet.
            </p>

        </div>

    </div>

    <footer>
        <p>© 2026 Sports Event Registration System</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
